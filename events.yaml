# Calendario de eventos macro con fecha publicada por la propia institución.
#
# Por qué un fichero curado y no una descarga en cada ejecución: son ocho
# reuniones al año por banco central, publicadas con más de un año de
# antelación. Descargarlas en el camino de decisión añadiría una dependencia
# de red que puede fallar justo cuando el asesor tiene que decidir, a cambio
# de un dato que cambia dos veces al año. Se refresca a mano y el bot avisa
# cuando se está quedando sin calendario.
#
# Cada fecha es la del DÍA DE LA DECISIÓN (segundo día de reunión), que es
# cuando el mercado se mueve, no la del primer día.

fuentes:
  fed: "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"
  bce: "https://www.ecb.europa.eu/press/calendars/mgcgc/html/index.en.html"

verificado_el: 2026-08-29

# La Reserva Federal advierte en su propia página: "each meeting date is
# tentative until confirmed at the meeting immediately preceding it".
eventos:
