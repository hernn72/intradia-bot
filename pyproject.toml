[project]
name = "intradia-bot"
version = "0.1.0"
description = "Asesor de inversión IA: detecta y puntúa oportunidades para ejecución manual en Trade Republic"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    "E501",
    "B008",
    # El proyecto corre en Python 3.12 local y 3.13 en producción, pero usa
    # Optional[X]/List[X] de forma consistente.
    "UP006", "UP007", "UP017", "UP035", "UP045",
    # Mantener el estilo existente al levantar el target de ruff a 3.12; no
    # fuerza una reescritura masiva de iteraciones ya cubiertas por tests.
    "B905", "RUF007",
    # "Unicode ambiguo": falsos positivos sobre texto en español (—, tildes, ≈).
    "RUF001", "RUF002", "RUF003",
    "C408",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "B018"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["\\.venv", "tests/"]
