name: CI

on:
  push:
  pull_request:
  # Reutilizable: el flujo de release ejecuta estos mismos checks sobre el tag,
  # para que «el tag pasó la CI» sea literalmente la misma comprobación y no
  # una copia que se desincroniza.
  workflow_call:

jobs:
  checks:
    name: checks (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy advisor

      - name: Run pytest
        run: python -m pytest -q --durations=10
