name: Release

# Un tag `vX.Y.Z` solo se convierte en release si pasa exactamente los mismos
# checks que un PR. Si fallan, el tag existe pero no hay release: la Pi
# despliega releases, no tags sueltos.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: publicar release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # El changelog se construye desde el tag anterior: hace falta el
          # historial entero, no el clon superficial por defecto.
          fetch-depth: 0

      - name: Construir el changelog desde el tag anterior
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          anterior="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          {
            if [ -n "${anterior}" ]; then
              echo "Cambios desde ${anterior}:"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${anterior}..${tag}"
            else
              echo "Primer release etiquetado."
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${tag}"
            fi
            echo
            echo
            echo "SHA del tag: $(git rev-list -n 1 "${tag}")"
          } > notas-release.md
          cat notas-release.md

      - name: Publicar el release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file notas-release.md
