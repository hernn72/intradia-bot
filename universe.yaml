# Universo de activos del asesor.
#
# CÓMO RELLENAR `isin` Y `trade_republic`
# ---------------------------------------
# Ninguno de los dos puede deducirse automáticamente: Trade Republic no expone
# un catálogo consultable. Por eso todos los activos nacen con
# `isin: null` y `trade_republic: unknown`, y el informe los marca como
# "⚠️ PENDIENTE DE VERIFICACIÓN" hasta que los confirmes tú:
#
#   1. Busca el valor en la app de Trade Republic.
#   2. Copia el ISIN que muestra la ficha del activo.
#   3. Pon `trade_republic: yes` (o `no` si no aparece).
#
# El ISIN se valida al cargar (formato + dígito de control), así que una
# errata al teclearlo hace fallar el arranque en vez de colarse en una
# recomendación.
#
# `analizable: false` = solo contexto de mercado, nunca recomendación.

groups:

  # --- Megacaps de EE. UU. cotizadas en Xetra, en EUR ---
  # Dan exposición a la bolsa estadounidense sin riesgo de divisa en la
  # ejecución: se compran en euros.
  usa_en_xetra:
    - symbol: APC.DE
      name: Apple
      asset_class: stock
      region: USA
      market: XETRA
      currency: EUR
      timezone: Europe/Berlin
      isin: null
      trade_republic: unknown

