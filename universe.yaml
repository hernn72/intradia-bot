# Universo de activos del asesor.
#
# `isin` y `trade_republic` son datos distintos. El ISIN se registra solo
# cuando se ha verificado con una fuente fiable; la disponibilidad en Trade
# Republic no puede deducirse del ISIN ni del mercado de datos porque no hay
# API pública del catálogo del broker.
#
# `currency` es la divisa de cotización del símbolo usado para datos.
# `economic_currency` describe la exposición económica principal: una acción
# estadounidense cotizada en Xetra puede tener `currency: EUR` y seguir
# teniendo exposición económica a USD.
#
# Trade Republic usa ejecución Best Price / Direct Price desde julio de 2026.
# Por eso `market` es solo mercado de datos; la ejecución del broker se modela
# con `broker` y `execution_mode`, cuyos valores por defecto son
# `trade_republic` y `best_price`.
#
# `analizable: false` = solo contexto o símbolo sin histórico suficiente;
# nunca recomendación.

